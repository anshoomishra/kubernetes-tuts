apiVersion: v1
kind: Namespace
metadata:
  name: scheduling-lab
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: scheduling-lab
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: scheduling-lab
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 32Mi
      default:
        cpu: 250m
        memory: 128Mi
