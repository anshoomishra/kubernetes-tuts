apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: databaseclaims.learning.example.com
spec:
  group: learning.example.com
  scope: Namespaced
  names:
    plural: databaseclaims
    singular: databaseclaim
    kind: DatabaseClaim
    shortNames:
      - dbclaim
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - engine
                - storageGB
              properties:
                engine:
                  type: string
                  enum:
                    - postgres
                    - mysql
                storageGB:
                  type: integer
                  minimum: 1
                  maximum: 100
            status:
              type: object
              properties:
                phase:
                  type: string
      subresources:
        status: {}
